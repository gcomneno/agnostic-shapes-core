[build-system]
requires = ["setuptools>=65.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "petra-interpretation"
version = "0.1.0"
description = "PETRA prime/exponent interpretations over ASHES"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["agnostic-shapes-core>=4.0.0,<5.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["petra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
